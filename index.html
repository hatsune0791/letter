<style>

:root {
    --bg: #100b14;
    --bg2: #17101d;
    --purple: #927ab3;
    --purple-light: #c8b9d8;
    --text: #eee9f2;
    --muted: #a69bab;
    --line: rgba(200,185,216,0.18);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 35%, #24162d 0%, #100b14 48%, #0c080f 100%);
    color: var(--text);
    font-family: "Manrope", sans-serif;
    font-weight: 300;
    letter-spacing: 0.01em;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    z-index: 999;
}

.hidden {
    display: none !important;
}

/* ---------------- PASSWORD ---------------- */

#passwordScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.password-box {
    width: min(400px, 90vw);
    text-align: center;
}

.mini-dog {
    font-size: 27px;
    opacity: 0.8;
    margin-bottom: 28px;
}

.password-box h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: 44px;
    font-weight: 500;
    margin: 0 0 8px;
    letter-spacing: 0.02em;
}

.password-box p {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 30px;
}

.password-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 13px 5px;
    color: white;
    text-align: center;
    font-family: "Manrope", sans-serif;
    font-size: 14px;
    outline: none;
    transition: border 0.3s ease;
}

.password-input:focus {
    border-bottom-color: var(--purple);
}

.password-button {
    margin-top: 25px;
    background: transparent;
    color: var(--purple-light);
    border: 1px solid var(--line);
    padding: 11px 28px;
    font-family: "Manrope", sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
}

.password-button:hover {
    border-color: var(--purple);
    background: rgba(146,122,179,0.08);
}

#error {
    color: #b89bbd;
    font-size: 11px;
    margin-top: 18px;
}

/* ---------------- MAIN ---------------- */

#mainSite {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.top {
    width: min(900px, 90%);
    padding-top: 45px;
    text-align: center;
}

.top-dog {
    font-size: 21px;
    opacity: 0.75;
}

.top-title {
    font-family: "Cormorant Garamond", serif;
    font-size: 17px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 10px;
    color: var(--purple-light);
}

/* ---------------- HOME BUTTONS ---------------- */

.home {
    min-height: 70vh;
    width: min(700px, 90%);
    display: flex;
    align-items: center;
    justify-content: center;
}

.menu {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.menu-item {
    position: relative;
    width: 100%;
    max-width: 470px;
    padding: 24px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    text-align: center;
    transition: all 0.35s ease;
}

.menu-item:first-child {
    border-top: 1px solid var(--line);
}

.menu-item:hover {
    background: rgba(146,122,179,0.045);
    padding-left: 12px;
    padding-right: 12px;
}

.menu-number {
    display: block;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.2em;
    margin-bottom: 5px;
}

.menu-name {
    font-family: "Cormorant Garamond", serif;
    font-size: 31px;
    font-weight: 500;
    letter-spacing: 0.04em;
}

.menu-sub {
    display: block;
    margin-top: 4px;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
}
